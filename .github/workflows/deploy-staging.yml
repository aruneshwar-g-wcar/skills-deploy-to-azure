name: Deploy to staging

on:
  pull_request:
    types: [labeled]

jobs:
  build:
    if: ${{ github.event.label.name == 'stage' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Dry run - would build and test the app."

  Build-Docker-Image:
    name: Simulate building and publishing the Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "Dry run - would build and push the Docker image to GHCR."

  Deploy-to-Azure:
    name: Simulate deploying to Azure
    runs-on: ubuntu-latest
    needs: Build-Docker-Image
    steps:
      - run: echo "Dry run - would deploy the image to Azure staging."
